<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>质量守恒微观实验室</title><style>
:root{--ink:#213b46;--muted:#657b84;--line:#d8e3e6;--teal:#14766d;--paper:#f8fbfc}*{box-sizing:border-box}body{margin:0;background:#edf3f5;color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:72px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top h1{font-size:21px;margin:0}.top p{font-size:10px;letter-spacing:2px;color:var(--teal);margin:0 0 4px}.offline{font-size:12px;color:var(--muted)}main{display:grid;grid-template-columns:210px minmax(400px,1fr) 300px;min-height:calc(100vh - 122px)}nav,aside{background:var(--paper)}nav{border-right:1px solid var(--line);padding:22px 14px}nav h2{font-size:13px;padding:0 8px}.tab{width:100%;display:block;text-align:left;padding:15px 12px;margin:7px 0;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink)}.tab strong,.tab small{display:block}.tab small{color:var(--muted);margin-top:5px;font-size:11px}.tab.active{background:#e4f2ef;border-color:#acd3ca;color:var(--teal)}.legend{border-top:1px solid var(--line);margin-top:24px;padding:18px 8px;font-size:11px;color:var(--muted);line-height:2}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;margin-right:6px;vertical-align:-2px}.scene{display:grid;grid-template-rows:50px minmax(420px,1fr) 88px}.bar{background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px}.bar button{border:0;background:transparent;color:var(--teal);padding:10px}.view{position:relative;overflow:hidden;background:radial-gradient(circle,#fbfdfd,#dce8eb);perspective:900px}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);z-index:5}.beaker{position:absolute;width:430px;height:330px;left:50%;top:48%;transform:translate(-50%,-50%) rotateX(5deg) rotateY(0deg);transform-style:preserve-3d;transition:transform .15s}.vessel{position:absolute;inset:20px 25px 10px;border:3px solid #a7c1c8;border-top-width:5px;border-radius:50% 50% 22% 22%/12% 12% 8% 8%;background:#d9edf00d;box-shadow:inset 0 -25px 45px #b8ced455,0 28px 25px #879ca033;pointer-events:none}.vessel:after{content:"";position:absolute;left:-3px;right:-3px;bottom:-5px;height:65px;border:3px solid #9eb8c0;border-radius:50%}.vessel.lid:before{content:"";position:absolute;left:-3px;right:-3px;top:-7px;height:60px;border:4px solid #7299a3;border-radius:50%;background:#b9d9df55}.atom{position:absolute;width:42px;height:42px;margin:-21px;border-radius:50%;display:grid;place-items:center;color:#20333c;font:bold 13px Arial;transform-style:preserve-3d;box-shadow:inset 8px 8px 10px #ffffff88,inset -8px -9px 12px #0003,3px 8px 9px #43586033;transition:opacity .15s;z-index:2}.bond{position:absolute;height:8px;border-radius:6px;background:#879aa2;transform-origin:0 50%;z-index:1;box-shadow:0 2px 2px #0001}.controls{background:var(--paper);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:16px 20px}.play{width:44px;height:44px;border:0;border-radius:50%;background:var(--teal);color:white;font-size:18px}.controls input{flex:1;accent-color:var(--teal)}.controls select{padding:7px;border:1px solid var(--line);border-radius:5px;background:white}aside{border-left:1px solid var(--line);padding:25px 22px}aside h2{font-size:21px;margin:0 0 6px}.sub{color:var(--muted);font-size:12px}.equation{background:#eef4f5;padding:16px 12px;border-radius:8px;text-align:center;font:600 16px/1.7 "Times New Roman",serif;margin:20px 0}.stage{font-size:13px;line-height:1.8;border-bottom:1px solid var(--line);padding-bottom:16px}.stage strong{color:var(--teal)}.counts{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.chip{border:1px solid var(--line);padding:6px 8px;border-radius:5px;font-size:11px}.chip b{color:var(--teal)}.system{margin-top:18px}.system button{border:1px solid var(--line);background:white;padding:8px 14px;color:var(--muted)}.system button.active{background:var(--teal);color:white}.system p,.note{font-size:11px;line-height:1.7;color:var(--muted)}.note{border-top:1px solid var(--line);padding-top:15px;margin-top:18px}footer{min-height:50px;background:var(--paper);border-top:1px solid var(--line);padding:14px 24px;font-size:12px}footer b{color:var(--teal);margin-right:10px}@media(max-width:900px){main{grid-template-columns:150px 1fr}aside{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.beaker{transform:translate(-50%,-50%) scale(.85)}}@media(max-width:560px){main{display:block}nav{display:grid;grid-template-columns:1fr 1fr;padding:8px}nav h2,.legend{display:none}.tab{margin:3px;padding:10px}.scene{grid-template-rows:48px 400px 80px}.beaker{transform:translate(-50%,-50%) scale(.72)}.offline{display:none}.top{padding:0 14px}.top h1{font-size:17px}footer{line-height:1.7}}
</style></head><body><header class="top"><div><p>CHEMISTRY · 微观视界</p><h1>质量守恒实验室</h1></div><span class="offline">完整单文件 · 无需网络</span></header><main><nav><h2>实验目录</h2><div id="tabs"></div><div class="legend" id="legend"></div></nav><section class="scene"><div class="bar"><span id="mode">反应前 · 微观粒子</span><span><button id="labelBtn">隐藏标签</button><button id="resetBtn">复位视角</button></span></div><div class="view" id="view"><div class="beaker" id="beaker"><div class="vessel" id="vessel"></div><div id="particles"></div></div><div class="hint">拖动画面旋转视角 · 粒子为教学简化模型</div></div><div class="controls"><button class="play" id="play">▶</button><input id="time" type="range" min="0" max="1000" value="0" aria-label="反应进度"><select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div></section><aside><h2 id="title"></h2><div class="sub" id="subtitle"></div><div class="equation" id="equation"></div><div class="stage"><strong id="stage"></strong><p id="description"></p></div><h3>原子守恒核查</h3><div class="counts" id="counts"></div><div class="system" id="system" hidden><button id="open" class="active">开放</button><button id="closed">密闭</button><p id="systemNote"></p></div><p class="note"><b>微观本质：</b>反应前后原子的种类、数目和质量不变，只是重新组合。</p></aside></main><footer><b>质量守恒定律</b>参加化学反应的各物质的质量总和，等于反应后生成的各物质的质量总和。</footer><script>
const C={Cu:['铜','#c77845'],O:['氧','#e45e5a'],Fe:['铁','#7c8e9c'],S:['硫','#e8bb45'],Na:['钠','#9b78c6'],C:['碳','#4c5963'],H:['氢','#f4f6f7'],Cl:['氯','#65ad74'],Mg:['镁','#aeb9c3']};
const a=(id,e,s,t)=>({id,e,s,t}),b=(x,y,p='both')=>({x,y,p});
function copper(){let A=[],B=[];[[-2,-.7],[-.7,.7],[.7,-.7],[2,.7]].forEach((q,i)=>{let x=120+q[0]*55,y=225+q[1]*25;A.push(a('Cu'+i,'Cu',[x,y],[x,y]));let ox=i<2?95+i*42:260+(i-2)*42;A.push(a('O'+i,'O',[ox,85],[x,y-55]));B.push(b('Cu'+i,'O'+i,'after'));if(i%2==0)B.push(b('O'+i,'O'+(i+1),'before'))});return[A,B]}
function iron(){let A=[a('Fe','Fe',[100,200],[305,135]),a('Cu','Cu',[300,135],[100,200]),a('S','S',[200,135],[200,135])],B=[];[[1,1],[-1,-1],[-1,1],[1,-1]].forEach((d,i)=>{A.push(a('O'+i,'O',[200+d[0]*48,135+d[1]*43],[200+d[0]*48,135+d[1]*43]));B.push(b('S','O'+i))});return[A,B]}
function carbonate(){let A=[a('C','C',[130,135],[315,45]),a('Na0','Na',[55,90],[105,230]),a('Na1','Na',[195,85],[190,230]),a('Cl0','Cl',[330,105,-25],[105,175]),a('Cl1','Cl',[330,105,25],[190,175]),a('H0','H',[280,105,-25],[155,70]),a('H1','H',[280,105,25],[215,65])],B=[b('H0','Cl0','before'),b('H1','Cl1','before'),b('Na0','Cl0','after'),b('Na1','Cl1','after')];for(let i=0;i<3;i++){let q=i*Math.PI*2/3,ends=[[270,45],[360,45],[185,115]][i];A.push(a('O'+i,'O',[130+Math.cos(q)*50,135+Math.sin(q)*50],ends));B.push(b('C','O'+i,i<2?'both':'before'))}B.push(b('O2','H0','after'),b('O2','H1','after'));return[A,B]}
function magnesium(){let A=[],B=[];for(let i=0;i<2;i++){let x=145+i*145;A.push(a('Mg'+i,'Mg',[x,220],[x,220]),a('O'+i,'O',[190+i*40,90],[x,160]));B.push(b('Mg'+i,'O'+i,'after'))}B.push(b('O0','O1','before'));return[A,B]}
const E={copper:{name:'铜与氧气反应',sub:'金属与氧气的化合反应',eq:'2Cu + O<sub>2</sub> → 2CuO',els:['Cu','O'],...copper(),st:['铜原子紧密聚集，氧分子由两个氧原子构成。','氧分子拆分，氧原子靠近铜原子并重新组合。','生成氧化铜，铜、氧原子的种类和数目均未改变。']},iron:{name:'铁与硫酸铜反应',sub:'金属与盐溶液的置换反应',eq:'Fe + CuSO<sub>4</sub> → FeSO<sub>4</sub> + Cu',els:['Fe','Cu','S','O'],...iron(),st:['铁原子构成金属铁，溶液中有铜离子和硫酸根。','铁原子失去电子，铜离子得到电子，发生电子转移。','铜原子析出，亚铁离子进入溶液，硫酸根整体不变。']},carbonate:{name:'碳酸钠与盐酸反应',sub:'有二氧化碳气体生成',eq:'Na<sub>2</sub>CO<sub>3</sub> + 2HCl → 2NaCl + H<sub>2</sub>O + CO<sub>2</sub>↑',els:['Na','Cl','C','O','H'],...carbonate(),gas:1,st:['钠离子、碳酸根与氯化氢粒子共存。','原有结合方式改变，原子开始重新组合。','生成氯化钠、水和二氧化碳；气体逸出但原子没有消失。']},magnesium:{name:'镁条燃烧',sub:'剧烈的发光、放热反应',eq:'2Mg + O<sub>2</sub> → 2MgO',els:['Mg','O'],...magnesium(),gas:2,st:['镁原子紧密聚集，氧分子由两个氧原子构成。','氧分子拆分，氧原子与镁原子重新组合并释放能量。','生成氧化镁，参加反应的氧气也有质量。']}};
let key='copper',cur=E[key],progress=0,playing=false,speed=1,closed=false,labels=true,last=0,atoms=new Map(),bonds=[];const $=id=>document.getElementById(id);$('tabs').innerHTML=Object.entries(E).map(([k,v])=>`<button class="tab" data-k="${k}"><strong>${v.name}</strong><small>${v.sub}</small></button>`).join('');
function smooth(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}function build(){atoms.clear();bonds=[];$('particles').innerHTML='';cur[0].forEach(o=>{let d=document.createElement('div');d.className='atom';d.textContent=o.e;d.style.background=C[o.e][1];$('particles').appendChild(d);atoms.set(o.id,d)});cur[1].forEach(o=>{let d=document.createElement('div');d.className='bond';$('particles').appendChild(d);bonds.push([d,o])});render()}
function render(){let mix=smooth((progress-.12)/.75),pos={};cur[0].forEach(o=>{let end=[...o.t];if(cur.gas===1&&closed&&['C','O0','O1'].includes(o.id))end[1]+=70;let x=o.s[0]+(end[0]-o.s[0])*mix,y=o.s[1]+(end[1]-o.s[1])*mix;pos[o.id]=[x,y];let d=atoms.get(o.id);d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=labels?1:.88;d.style.color=labels?'#20333c':'transparent'});bonds.forEach(([d,o])=>{let p=pos[o.x],q=pos[o.y],dx=q[0]-p[0],dy=q[1]-p[1],show=o.p==='both'?1:o.p==='before'?1-smooth((progress-.2)/.28):smooth((progress-.5)/.28);d.style.left=p[0]+'px';d.style.top=p[1]+'px';d.style.width=Math.hypot(dx,dy)+'px';d.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;d.style.opacity=show*.75});let n=progress<.2?0:progress<.82?1:2;$('stage').textContent=['反应前','反应中','反应后'][n];$('description').textContent=cur.st[n];$('mode').textContent=['反应前','反应中','反应后'][n]+' · 微观粒子';if(document.activeElement!==$('time'))$('time').value=progress*1000;systemNote()}
function systemNote(){if(!cur.gas)return;$('systemNote').textContent=closed?'气体留在密闭容器内，反应前后容器内物质总质量不变。':cur.gas===1?'二氧化碳逸出后，只称量剩余物质时读数会减小，但逸出气体仍有质量。':'空气中的氧气参与反应，氧化镁的质量大于原镁条。'}
function select(k){key=k;cur=E[k];progress=0;playing=false;closed=false;$('play').textContent='▶';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.k===k));$('title').textContent=cur.name;$('subtitle').textContent=cur.sub;$('equation').innerHTML=cur.eq;$('legend').innerHTML='<b>粒子图例</b><br>'+cur.els.map(e=>`<span class="dot" style="background:${C[e][1]}"></span>${C[e][0]}原子`).join('<br>');let count={};cur[0].forEach(o=>count[o.e]=(count[o.e]||0)+1);$('counts').innerHTML=Object.entries(count).map(([e,n])=>`<span class="chip">${e}：反应前 ${n} → <b>反应后 ${n}</b></span>`).join('');$('system').hidden=!cur.gas;$('vessel').classList.remove('lid');$('open').classList.add('active');$('closed').classList.remove('active');build()}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>select(x.dataset.k));$('play').onclick=()=>{if(progress>=1)progress=0;playing=!playing;$('play').textContent=playing?'Ⅱ':'▶';last=performance.now()};$('time').oninput=e=>{progress=e.target.value/1000;playing=false;$('play').textContent='▶';render()};$('speed').onchange=e=>speed=+e.target.value;$('labelBtn').onclick=()=>{labels=!labels;$('labelBtn').textContent=labels?'隐藏标签':'显示标签';render()};function setClosed(x){closed=x;$('vessel').classList.toggle('lid',x);$('open').classList.toggle('active',!x);$('closed').classList.toggle('active',x);render()}$('open').onclick=()=>setClosed(false);$('closed').onclick=()=>setClosed(true);
let rx=5,ry=0,drag=false,px=0,py=0;function camera(){$('beaker').style.transform=`translate(-50%,-50%) rotateX(${rx}deg) rotateY(${ry}deg)`}$('view').onpointerdown=e=>{drag=true;px=e.clientX;py=e.clientY;$('view').setPointerCapture(e.pointerId)};$('view').onpointermove=e=>{if(!drag)return;ry+=(e.clientX-px)*.3;rx=Math.max(-15,Math.min(25,rx-(e.clientY-py)*.2));px=e.clientX;py=e.clientY;camera()};$('view').onpointerup=()=>drag=false;$('resetBtn').onclick=()=>{rx=5;ry=0;camera()};function loop(t){if(playing){progress=Math.min(1,progress+(t-last)/10000*speed);last=t;if(progress>=1){playing=false;$('play').textContent='▶'}render()}requestAnimationFrame(loop)}select('copper');requestAnimationFrame(loop);
</script></body></html>
